<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mpGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#00FF7F" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Badge -->
  <rect width="64" height="64" rx="16" fill="#0A0A0A" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#mpGrad)" stroke-width="2" opacity="0.8" />
  
  <!-- "MP" Monogram Text -->
  <text 
    x="32" 
    y="43" 
    font-family="'Fira Code', 'Poppins', 'SF Pro Display', -apple-system, sans-serif" 
    font-size="28" 
    font-weight="900" 
    fill="url(#mpGrad)" 
    text-anchor="middle"
    letter-spacing="-1px"
    filter="url(#glow)"
  >MP</text>
</svg>
